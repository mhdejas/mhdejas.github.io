<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfdfb">
  <title>Page not found — Muhammed Ejas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found { display: grid; min-height: 100svh; align-content: center; padding-block: 3rem; }
    .not-found-inner { max-width: 640px; }
    .not-found h1 { margin-bottom: 1rem; font-size: clamp(3rem, 8vw, 5.5rem); }
    .not-found p:not(.section-kicker) { max-width: 500px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <main class="not-found section-shell">
    <div class="not-found-inner">
      <p class="section-kicker">404 · Page not found</p>
      <h1>This page isn’t here.</h1>
      <p>The link may have moved, or the address may be incomplete. Return to the portfolio homepage.</p>
      <a class="button button-primary" href="/"><span>Back to home</span><span class="button-icon" aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
